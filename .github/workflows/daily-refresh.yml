name: daily-refresh
on:
  schedule:
    - cron: "30 11 * * *"   # 4:30 AM Pacific (daylight time), after the 11:00 UTC Supabase data refresh
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: daily-refresh
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Rebuild data.js
        run: python pipeline/build.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DCP_OUT: data.js
      - name: Commit and push
        run: |
          git config user.name "sk-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main
          done
