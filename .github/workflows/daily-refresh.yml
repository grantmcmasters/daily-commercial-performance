name: daily-refresh
# Every morning at 4:07 AM Pacific: rebuild data.js from the database, then render the deck, write the
# AI summary and email it to the team.  GitHub cron runs in UTC, so two schedules cover daylight and
# standard time and the first job keeps only the one that lands at 4:07 AM Pacific.  The odd minute is
# deliberate: GitHub delays or drops schedules that fire at the top of the hour when its queue is busy
# (the 4:00 run was skipped on 2026-09-10).
on:
  schedule:
    - cron: "7 11 * * *"   # 4:07 AM PDT
    - cron: "7 12 * * *"   # 4:07 AM PST
    - cron: "37 11 * * *"  # 4:37 AM PDT backup: runs only if the 4:07 run never sent the email
    - cron: "37 12 * * *"  # 4:37 AM PST backup
  workflow_dispatch:
    inputs:
      send_to:
        description: "Send the email only to these addresses (comma separated). Leave blank for the normal list."
        required: false
        default: ""
      skip_email:
        description: "Rebuild the data only, no email"
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency: daily-refresh
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 4:07 AM Pacific is 11:07 UTC in daylight time and 12:07 UTC in standard time; the other hour's crons are ignored
          OFF=$(TZ=America/Los_Angeles date +%z)
          SCHED="${{ github.event.schedule }}"
          MIN=$(echo "$SCHED" | awk '{print $1}'); HOUR=$(echo "$SCHED" | awk '{print $2}')
          WANT=11; [ "$OFF" = "-0800" ] && WANT=12
          echo "Pacific offset $OFF, schedule '$SCHED', Pacific time now $(TZ=America/Los_Angeles date '+%H:%M')"
          if [ "$HOUR" != "$WANT" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$MIN" = "7" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # the 4:37 backup slot: take over only if no run has sent today's email (GitHub sometimes skips a schedule)
          SINCE=$(TZ=America/Los_Angeles date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%SZ)
          SENT=""
          for id in $(gh run list --workflow daily-refresh.yml --limit 20 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$SINCE\") | .databaseId" 2>/dev/null); do
            if gh run view "$id" --json jobs --jq '.jobs[] | select(.name == "email" and .conclusion == "success") | .name' 2>/dev/null | grep -q email; then SENT="$id"; break; fi
          done
          if [ -n "$SENT" ]; then echo "run $SENT already sent today's email; the backup slot stands down"; echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "no email has gone out today; the backup slot runs the job"; echo "run=true" >> "$GITHUB_OUTPUT"; fi
  rebuild:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Rebuild data.js
        run: |
          for i in 1 2 3; do
            python pipeline/build.py && break
            echo "rebuild attempt $i failed"; [ "$i" = "3" ] && exit 1
            sleep 120
          done
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DCP_OUT: data.js
      - name: Commit and push
        run: |
          git config user.name "sk-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data.js details.js directory.js health
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main
          done
  email:
    needs: [gate, rebuild]
    # runs whenever the gate opened, even if the rebuild failed (the email then carries the last good data, dated in the subject)
    if: ${{ always() && needs.gate.outputs.run == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.skip_email) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the export libraries
        run: npm ci --prefix pipeline
      - name: Render the deck
        run: node pipeline/export_deck.js deck.pdf
      - name: Yesterday's data for the day over day comparison
        run: |
          PREV=$(git log --format=%H -n 1 --skip=1 -- data.js || true)
          if [ -n "$PREV" ]; then git show "$PREV:data.js" > prev.js; echo "using $PREV"; else echo "no earlier data.js"; fi
      - name: Write the summary
        run: python pipeline/summarize.py --today data.js --yesterday prev.js --out summary.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-fable-5-1' }}
      - name: Send the email
        run: python pipeline/send_mail.py --summary summary.html --pdf deck.pdf ${{ inputs.send_to && format('--to "{0}"', inputs.send_to) || '' }}
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MAIL_SMTP_HOST: ${{ vars.MAIL_SMTP_HOST || 'smtp.gmail.com' }}
          MAIL_SMTP_PORT: ${{ vars.MAIL_SMTP_PORT || '465' }}
      - name: Keep the deck and summary for 14 days
        uses: actions/upload-artifact@v4
        with:
          name: deck-${{ github.run_id }}
          path: |
            deck.pdf
            summary.md
          retention-days: 14
